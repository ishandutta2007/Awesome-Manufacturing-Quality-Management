<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="accent-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 46px; fill: url(#text-grad); }
      .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #cbd5e1; }
      .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
      @keyframes pulse-wave {
        0% { transform: translateY(0px) scaleY(1); opacity: 0.3; }
        50% { transform: translateY(-10px) scaleY(1.1); opacity: 0.6; }
        100% { transform: translateY(0px) scaleY(1); opacity: 0.3; }
      }
      @keyframes rotate-gear {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes float-particle {
        0% { transform: translate(0, 0); opacity: 0.2; }
        50% { opacity: 0.7; }
        100% { transform: translate(40px, -60px); opacity: 0.2; }
      }
      .gear { transform-origin: 1050px 160px; animation: rotate-gear 25s linear infinite; opacity: 0.15; }
      .wave { animation: pulse-wave 6s ease-in-out infinite; }
      .p1 { animation: float-particle 8s infinite; }
      .p2 { animation: float-particle 12s infinite 2s; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)"/>

  <!-- Dynamic Background Elements (Kept behind foreground text) -->
  <g class="gear">
    <path d="M1050 70 L1070 70 L1075 95 A75 75 0 0 1 1105 107 L1128 94 L1142 108 L1129 131 A75 75 0 0 1 1141 161 L1166 166 L1166 186 L1141 191 A75 75 0 0 1 1129 221 L1142 244 L1128 258 L1105 245 A75 75 0 0 1 1075 257 L1070 282 L1050 282 L1045 257 A75 75 0 0 1 1015 245 L992 258 L978 244 L991 221 A75 75 0 0 1 979 191 L954 186 L954 166 L979 161 A75 75 0 0 1 991 131 L978 108 L992 94 L1015 107 A75 75 0 0 1 1045 95 Z M1050 120 A40 40 0 1 0 1050 200 A40 40 0 1 0 1050 120 Z" fill="#818cf8"/>
  </g>

  <!-- Dynamic Animated SPC Waveform Graphic (Background Accent) -->
  <path class="wave" d="M 50,250 Q 150,210 250,240 T 450,200 T 650,260 T 850,220 T 1050,240 L 1150,230" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.4"/>
  <path class="wave" d="M 50,260 Q 200,280 350,230 T 650,210 T 950,250 L 1150,220" fill="none" stroke="#c084fc" stroke-width="2" opacity="0.3" style="animation-delay: -3s;"/>

  <!-- Floating particles -->
  <circle class="p1" cx="200" cy="100" r="4" fill="#38bdf8"/>
  <circle class="p2" cx="800" cy="80" r="5" fill="#c084fc"/>
  <circle class="p1" cx="950" cy="220" r="3" fill="#818cf8"/>

  <!-- Grid overlay lines -->
  <line x1="50" y1="270" x2="1150" y2="270" stroke="#475569" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>
  <line x1="50" y1="50" x2="1150" y2="50" stroke="#475569" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>

  <!-- Foreground Content Block (Layered on top of dynamic graphics) -->
  <g transform="translate(60, 0)">
    <!-- Top Pill Badge -->
    <rect x="0" y="45" width="310" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="15" y="66" class="badge-text">⚙️ INDUSTRY 4.0 &amp; QMS ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="135" class="title" filter="url(#glow)">Awesome Manufacturing Quality Management</text>

    <!-- Accent Line -->
    <rect x="0" y="155" width="680" height="4" rx="2" fill="url(#accent-line)"/>

    <!-- Subtitle -->
    <text x="0" y="200" class="subtitle">Curated SaaS Platforms, Enterprise Software &amp; Open-Source Projects for QMS,</text>
    <text x="0" y="230" class="subtitle">CAPA, SPC, FMEA, ISO 9001 / IATF 16949 &amp; Smart Shop-Floor Compliance.</text>

    <!-- Tag Pills -->
    <g transform="translate(0, 258)">
      <rect x="0" y="0" width="110" height="26" rx="6" fill="#334155"/>
      <text x="12" y="17" font-family="sans-serif" font-size="12" fill="#94a3b8" font-weight="600">📊 SPC Tools</text>

      <rect x="120" y="0" width="120" height="26" rx="6" fill="#334155"/>
      <text x="132" y="17" font-family="sans-serif" font-size="12" fill="#94a3b8" font-weight="600">🛠️ FMEA &amp; CAPA</text>

      <rect x="250" y="0" width="130" height="26" rx="6" fill="#334155"/>
      <text x="262" y="17" font-family="sans-serif" font-size="12" fill="#94a3b8" font-weight="600">📜 ISO &amp; Compliance</text>

      <rect x="390" y="0" width="140" height="26" rx="6" fill="#334155"/>
      <text x="402" y="17" font-family="sans-serif" font-size="12" fill="#94a3b8" font-weight="600">🚀 Open-Source QMS</text>
    </g>
  </g>
</svg>
